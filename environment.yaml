name: f0-mlf

channels:
  - conda-forge
  - pytorch
  - nvidia

dependencies:
  - python=3.10
  - pip>=24
  - setuptools>=61
  - lightning=2.*
  - torchmetrics=1.*
  - hydra-core=1.*
  - rich=13.*
  - pre-commit=3.*
  - pytest=7.*
  - wandb=0.*
  - numpy=2.*
  - scipy=1.*
  - matplotlib=3.*
  - jupyterlab=4.*
  - pandas=2.*
  - scikit-learn=1.*
  - tqdm=4.*
  - ffmpeg=7.*
  - pytorch::pytorch=2.*
  - pytorch::torchaudio=2.*
  - pytorch::pytorch-cuda=11.8
  - torchinfo=1.*

  - pip:
      - hydra-optuna-sweeper==1.*
      - hydra-colorlog==1.*
      - rootutils==1.*
      - mir_eval==0.*
      - soundfile==0.*
      - nnAudio==0.*
      - tensorboard==2.*
      - autoroot==1.*
      - autorootcwd==1.*
      - librosa==0.10.2
      - onnxruntime==1.*
      - einops==0.*
      - df0-pitch==1.0.1
